[template]
name = "java"
weft-version = "0.1"
description = "A Java 25 app on Gradle (Kotlin DSL) with an opinionated tooling stack (Spotless + palantir-java-format, Error Prone, JUnit 6, AssertJ), growing into a Spring Boot web service."

[[question]]
id = "project_name"
kind = "string"
prompt = "Project name"
example = "Demo Service"

[[question]]
id = "app_slug"
kind = "string"
computed = true
default = "project_name.lower().replace(' ', '-')"

[[question]]
id = "use_spring_boot"
kind = "bool"
prompt = "Add Spring Boot (a web service)?"
default = "True"

[[question]]
id = "package"
kind = "string"
prompt = "Base package"
example = "com.example.demo"
default = "'com.example.app'"
when = "use_spring_boot"

[[question]]
id = "package_path"
kind = "string"
computed = true
default = "package.replace('.', '/')"
when = "use_spring_boot"

[[question]]
id = "use_testcontainers"
kind = "bool"
prompt = "Add Testcontainers integration tests?"
default = "True"
when = "use_spring_boot"

[[question]]
id = "use_github_actions"
kind = "bool"
prompt = "Add a GitHub Actions CI workflow?"
default = "True"

[[question]]
id = "use_renovate"
kind = "bool"
prompt = "Add Renovate dependency-update config?"
default = "True"

[[question]]
id = "use_github"
kind = "bool"
prompt = "Hosted on GitHub?"
description = "Installs the skills for issues, pull requests, README and repository metadata. They drive gh; no MCP server is added."
default = "True"

[[question]]
id = "use_linear"
kind = "bool"
prompt = "Track work in Linear?"
description = "Installs the Linear skills and the Linear remote MCP server (OAuth per user, nothing stored in the repo) for Claude Code, Codex and oh-my-pi."
default = "True"

[[question]]
id = "use_jira"
kind = "bool"
prompt = "Track work in Jira?"
description = "Installs the Jira skills and the Atlassian remote MCP server (OAuth per user, nothing stored in the repo) for Claude Code, Codex and oh-my-pi."
default = "False"

[[question]]
id = "use_anki"
kind = "bool"
prompt = "Write Anki flashcards about this project?"
description = "Installs anki-flashcards and remembering-what-you-built. AnkiConnect is per machine, so its MCP server stays in user-level config."
default = "False"

[[question]]
id = "use_obsidian"
kind = "bool"
prompt = "Keep this project's ideas in an Obsidian vault?"
description = "Installs idea-garden. The vault path is per machine, so its MCP server stays in user-level config."
default = "False"
