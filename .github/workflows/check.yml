name: Check templates

# The job builds weft from source at WEFT_REF, a release tag of the public
# SoheilSalmani/weft repository, so no token is needed to check it out. Bump
# WEFT_REF to move every check to a newer weft.

on:
  push:
    branches: [main]
  pull_request:

env:
  WEFT_REF: v0.1.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out weft
        uses: actions/checkout@v4
        with:
          repository: SoheilSalmani/weft
          ref: ${{ env.WEFT_REF }}
          path: .weft-src

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .weft-src
          cache-on-failure: true

      - name: Install weft
        run: cargo install --path .weft-src/crates/weft-cli --locked

      - name: Portable patches match base
        run: scripts/check-portable-drift.sh

      - name: weft check every template
        run: scripts/check-templates.sh
