name: Check templates

# The job builds weft from source at WEFT_REF, a release tag or commit of the
# public SoheilSalmani/weft repository, so no token is needed to check it out.
# Bump WEFT_REF to move every check to a newer weft. The templates need weft
# 3751f9e or later: stacks narrow base's questions with [refine] and order
# their hooks with `before`, which the 0.1.0 release ignores and rejects;
# base's `mcp` patch declares the slot `weft share` wrote, which only builds
# from 116e293 on can amend; and the extracting-weft-templates skill in base
# adopts a project with --scope, which commits only from 3751f9e on.

on:
  push:
    branches: [main]
  pull_request:

env:
  WEFT_REF: 3751f9e876d1990dd2f89703e6f96ffc4f61289d

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out weft
        uses: actions/checkout@v4
        with:
          repository: SoheilSalmani/weft
          ref: ${{ env.WEFT_REF }}
          path: .weft-src

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .weft-src
          cache-on-failure: true

      - name: Install weft
        run: cargo install --path .weft-src/crates/weft-cli --locked

      - name: weft check every template
        run: scripts/check-templates.sh
