[template]
name = "base"
weft-version = "0.1"
description = "The root every repository starts from: editor and git configuration, a mise toolchain, a Paseo worktree setup, agent instructions, the house Agent Skills, and MCP connections for the services the project uses, for Claude Code, Codex and oh-my-pi. Every patch except base is portable into the stack templates."

[[question]]
id = "project_name"
kind = "string"
prompt = "Project name"
description = "Human-facing name; becomes the README title."
example = "Demo Service"

[[question]]
id = "use_github"
kind = "bool"
prompt = "Hosted on GitHub?"
description = "Installs the skills for issues, pull requests, README and repository metadata, which drive gh, and GitHub's remote MCP server (a personal access token each person exports as GITHUB_PAT_TOKEN, nothing stored in the repo) for Claude Code, Codex and oh-my-pi."
default = "True"

[[question]]
id = "use_linear"
kind = "bool"
prompt = "Track work in Linear?"
description = "Installs the Linear skills and the Linear remote MCP server (OAuth per user, nothing stored in the repo) for Claude Code, Codex and oh-my-pi."
default = "True"

[[question]]
id = "use_jira"
kind = "bool"
prompt = "Track work in Jira?"
description = "Installs the Jira skills and the Atlassian remote MCP server (OAuth per user, nothing stored in the repo) for Claude Code, Codex and oh-my-pi."
default = "False"

[[question]]
id = "use_notion"
kind = "bool"
prompt = "Keep this project's docs or tasks in Notion?"
description = "Installs Notion's remote MCP server (OAuth per user, nothing stored in the repo) for Claude Code, Codex and oh-my-pi."
default = "False"

[[question]]
id = "use_anki"
kind = "bool"
prompt = "Write Anki flashcards about this project?"
description = "Installs anki-flashcards and remembering-what-you-built, and the anki MCP server they call (run by npx against AnkiConnect on localhost, nothing stored in the repo) for Claude Code, Codex and oh-my-pi."
default = "False"

[[question]]
id = "use_obsidian"
kind = "bool"
prompt = "Keep this project's ideas in an Obsidian vault?"
description = "Installs idea-garden and the MCP server of Obsidian's Local REST API with MCP plugin (its HTTP server turned on and its API key exported as OBSIDIAN_MCP_API_KEY by each person, nothing stored in the repo) for Claude Code, Codex and oh-my-pi."
default = "False"

[[question]]
id = "use_meetings"
kind = "bool"
prompt = "Prepare client meetings from this project?"
description = "Installs preparing-client-meetings, which prepares what to say at dailies and weeklies from pull requests and tickets, in a weekly note in the Obsidian vault. The vault is found per machine, so nothing about it is stored in the repo."
default = "False"

[[question]]
id = "use_weft"
kind = "bool"
prompt = "Work on Weft or Weft templates in this project?"
description = "Installs weft-conventions and the skills for creating, extracting and splitting Weft templates."
default = "False"

[[question]]
id = "stack_skills"
kind = "multichoice"
choices = ["dbt", "lightdash", "slides"]
prompt = "Stack skills"
description = "Installs the Agent Skills written for one stack: the five dbt skills, Lightdash's three for a dbt project on Lightdash, or writing-slides for a slide deck. Each stack template offers only its own: dbt selects its skills and offers Lightdash's, and slides always installs writing-slides."
default = "[]"

[[question]]
id = "commit_skills"
kind = "bool"
prompt = "Commit the Agent Skills to git?"
description = "When false, .agents/ and the .claude/skills/ links are gitignored; weft still renders and updates them, and every new git worktree, Paseo's included, gets a copy from the main checkout. Any false commit_* answer also gitignores paseo.json and .weft/, whose base.json holds a copy of every rendered file."
default = "True"

[[question]]
id = "commit_mcp"
kind = "bool"
prompt = "Commit the MCP server configuration to git?"
description = "When false, .mcp.json, .codex/ and .omp/ are gitignored and copied into every new git worktree instead. Asked whatever servers the other answers turn on, since a stack can add its own server to them. Any false commit_* answer also gitignores paseo.json and .weft/."
default = "True"

[[question]]
id = "commit_mise"
kind = "bool"
prompt = "Commit mise.toml to git?"
description = "When false, mise.toml is gitignored like mise.local.toml and copied into every new git worktree, and the README leaves out its mise install step. Any false commit_* answer also gitignores paseo.json and .weft/."
default = "True"

[[question]]
id = "commit_instructions"
kind = "bool"
prompt = "Commit AGENTS.md and CLAUDE.md to git?"
description = "AGENTS.md documents the skills, MCP servers and mise setup, so it defaults to staying out of git whenever one of them does. When false, AGENTS.md and CLAUDE.md are gitignored and copied into every new git worktree. Any false commit_* answer also gitignores paseo.json and .weft/."
default = "commit_skills and commit_mcp and commit_mise"
