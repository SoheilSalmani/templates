[template]
name = "slides"
weft-version = "0.1"
description = "A slide deck written in MDX on Vite and React, styled by Tailwind CSS and shadcn/ui and animated with Motion. Code is highlighted at build time by Shiki, with highlight steps, folds, diffs that switch between one column and side by side, magic moves, tabs, a file explorer with file-type icons and snippets read from real files, and optionally type-checked by Twoslash; Mermaid diagrams are drawn at build time, and optionally diagrams and dbt lineage graphs that change from step to step, drawn by React Flow; the slides are type-checked, and pnpm check renders every step of every slide to catch content that does not fit. Ships the writing-slides Agent Skill, optional GitHub Actions and Pages workflows, and the house editor, git, mise, Paseo, agent-instruction, skill and MCP configuration."

[[question]]
id = "project_name"
kind = "string"
prompt = "Project name"
description = "Human-facing name; becomes the deck's title, the README title and, slugified, the package name in package.json."
example = "Demo Talk"

[[question]]
id = "package_name"
kind = "string"
computed = true
default = "'-'.join(''.join([c if c.isalnum() else ' ' for c in project_name.lower().elems()]).split())"

[[question]]
id = "use_github"
kind = "bool"
prompt = "Hosted on GitHub?"
description = "Installs the skills for issues, pull requests, README and repository metadata. They drive gh; no MCP server is added."
default = "True"

[[question]]
id = "use_linear"
kind = "bool"
prompt = "Track work in Linear?"
description = "Installs the Linear skills and the Linear remote MCP server (OAuth per user, nothing stored in the repo) for Claude Code, Codex and oh-my-pi."
default = "True"

[[question]]
id = "use_jira"
kind = "bool"
prompt = "Track work in Jira?"
description = "Installs the Jira skills and the Atlassian remote MCP server (OAuth per user, nothing stored in the repo) for Claude Code, Codex and oh-my-pi."
default = "False"

[[question]]
id = "use_anki"
kind = "bool"
prompt = "Write Anki flashcards about this project?"
description = "Installs anki-flashcards and remembering-what-you-built. AnkiConnect is per machine, so its MCP server stays in user-level config."
default = "False"

[[question]]
id = "use_obsidian"
kind = "bool"
prompt = "Keep this project's ideas in an Obsidian vault?"
description = "Installs idea-garden. The vault path is per machine, so its MCP server stays in user-level config."
default = "False"

[[question]]
id = "use_meetings"
kind = "bool"
prompt = "Prepare client meetings from this project?"
description = "Installs preparing-client-meetings, which prepares what to say at dailies and weeklies from pull requests and tickets, in a weekly note in the Obsidian vault. The vault is found per machine, so nothing about it is stored in the repo."
default = "False"

[[question]]
id = "use_twoslash"
kind = "bool"
prompt = "Type-check TypeScript on the slides with Twoslash?"
description = "Adds `twoslash` to code fences: TypeScript runs on the block when the deck builds, types show on hover and under `// ^?`, and an error the block does not declare with `// @errors` stops the build. Adds Twoslash and TypeScript's language service to the build."
default = "True"

[[question]]
id = "use_react_flow"
kind = "bool"
prompt = "Draw diagrams that change, with React Flow?"
description = "Adds `flow` fences: a Mermaid flowchart drawn in the browser by React Flow and laid out by dagre, whose versions, split by `---`, are steps animated from one to the next, with new, changed, moved and removed nodes marked. Adds React Flow and dagre to the deck's bundle."
default = "True"

[[question]]
id = "use_dbt_lineage"
kind = "bool"
prompt = "Draw dbt lineage graphs?"
description = "Adds `dbt` fences: a lineage written as `stg_orders -> fct_orders (incremental)`, drawn with dbt's node kinds, layers and materializations, whose versions animate a change to the project: models added, removed, renamed, re-materialized or moved in the lineage. Asked when React Flow is on."
default = "False"
when = "use_react_flow"

[[question]]
id = "use_github_actions"
kind = "bool"
prompt = "Check the deck on GitHub Actions?"
description = "Adds a workflow that runs pnpm check on every push to main and every pull request, and keeps an image of every slide as an artifact. Defaults to whether the project is on GitHub."
default = "use_github"

[[question]]
id = "use_github_pages"
kind = "bool"
prompt = "Publish the deck on GitHub Pages?"
description = "Adds a workflow that builds the deck and deploys it to GitHub Pages on every push to main. Set the repository's Pages source to GitHub Actions once, first."
default = "False"
