[template]
name = "fastapi"
weft-version = "0.1"
description = "A FastAPI service on Python 3.13 managed by uv, with the house editor, git, mise, Paseo, agent-instruction, skill and MCP configuration."
extends = "../base"

[[question]]
id = "package_name"
kind = "string"
computed = true
default = "project_name.lower().replace(' ', '-')"

[refine.project_name]
description = "Human-facing name; becomes the README title and, slugified, the package name in pyproject.toml."

[refine.stack_skills]
choices = []
