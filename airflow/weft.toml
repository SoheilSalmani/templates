[template]
name = "airflow"
weft-version = "0.1"
description = "An Apache Airflow project generated by the Astro CLI on Astro Runtime, with the house editor, git, mise, Paseo, agent-instruction, skill and MCP configuration."
extends = "../base"

[[question]]
id = "package_name"
kind = "string"
computed = true
default = "project_name.lower().replace(' ', '-')"

[refine.project_name]
description = "Human-facing name; its slug names the Astro project in .astro/config.yaml."

[refine.commit_mise]
description = "When false, mise.toml is gitignored like mise.local.toml and copied into every new git worktree. Any false commit_* answer also gitignores paseo.json and .weft/."

[refine.stack_skills]
choices = []
