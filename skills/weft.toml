[template]
name = "skills"
weft-version = "0.1"
description = "Agent Skills for a project: a base set that applies anywhere, plus the skills matching the external tools the project actually uses (Jira, Linear, GitHub, Anki, Obsidian)."

[[question]]
id = "use_github"
kind = "bool"
prompt = "Do you use GitHub (issues, pull requests, repository metadata)"
default = "True"

[[question]]
id = "use_jira"
kind = "bool"
prompt = "Do you use Jira"
default = "False"

[[question]]
id = "use_linear"
kind = "bool"
prompt = "Do you use Linear"
default = "False"

[[question]]
id = "use_anki"
kind = "bool"
prompt = "Do you use Anki for flashcards"
default = "False"

[[question]]
id = "use_obsidian"
kind = "bool"
prompt = "Do you keep an Obsidian ideation vault"
default = "False"
