[template]
name = "scala"
weft-version = "0.1"
description = "A Scala 3 (or 2.13) hello world on scala-cli with scalafmt, optionally as an sbt build with a ZIO entry point, on a JDK 25 mise toolchain with the house editor and git configuration, Paseo worktree setup, agent instructions, skills and MCP connections."
extends = "../base"

[[question]]
id = "scala_version"
kind = "choice"
choices = ["3.8.4", "3.3.8", "2.13.18"]
prompt = "Scala version"
description = "Scala release pinned in the scala-cli directive (or scalaVersion in build.sbt); the scalafmt dialect follows it."
default = "'3.8.4'"

[[question]]
id = "scalafmt_runner_dialect"
kind = "choice"
computed = true
choices = ["scala3", "Scala33", "scala213"]
default = "{'3.8.4': 'scala3', '3.3.8': 'Scala33'}.get(scala_version, 'scala213')"

[[question]]
id = "use_sbt"
kind = "bool"
prompt = "Build with sbt?"
description = "Replaces the scala-cli entry point with an sbt build (build.sbt, project/build.properties, src/main/scala)."
default = "True"

[[question]]
id = "project_version"
kind = "string"
prompt = "Project version"
description = "Initial version written to build.sbt."
example = "0.1.0"
default = "'0.1.0'"
when = "use_sbt"

[[question]]
id = "project_organization"
kind = "string"
prompt = "Project organization"
description = "Organization written to build.sbt, usually a reverse domain name."
example = "com.example"
default = "'com.example'"
when = "use_sbt"

[[question]]
id = "use_zio"
kind = "bool"
prompt = "Use ZIO?"
description = "Replaces the sbt hello-world entry point with a ZIOAppDefault application."
default = "False"
when = "use_sbt"

[refine.project_name]
description = "Human-facing name; becomes the README title and the sbt project name."

[refine.stack_skills]
choices = []
