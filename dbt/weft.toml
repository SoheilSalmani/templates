[template]
name = "dbt"
weft-version = "0.1"
description = "A dbt project on uv-managed Python 3.13 with dbt_utils, the house Agent Skills including the dbt ones, and an opinionated mise toolchain (Node 24, uv)."
extends = "../base"

[[question]]
id = "package_name"
kind = "string"
computed = true
default = "project_name.lower().replace(' ', '_')"

[[question]]
id = "profile_name"
kind = "string"
prompt = "Profile name"
description = "The profiles.yml entry dbt_project.yml points at; defaults to the project slug."
example = "demo_warehouse"
default = "package_name"

[refine.project_name]
description = "Human-facing name; its snake_case slug names the dbt project and the Python package."

[refine.stack_skills]
choices = ["dbt"]
default = "['dbt']"
